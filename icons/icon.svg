      <line x1="256" y1="126" x2="256" y2="116" stroke-width="2.0" transform="rotate(310 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="116" stroke-width="2.0" transform="rotate(320 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="116" stroke-width="2.0" transform="rotate(330 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="116" stroke-width="2.0" transform="rotate(340 256 256)"/>
