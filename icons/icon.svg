<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6dbc2"/><stop offset="1" stop-color="#cfc0a0"/></linearGradient>
    <radialGradient id="glass" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/><stop offset=".55" stop-color="#eadcbc" stop-opacity=".8"/><stop offset="1" stop-color="#a98f68" stop-opacity=".7"/></radialGradient>
    <radialGradient id="bezel" cx="36%" cy="28%" r="85%"><stop offset="0" stop-color="#4d4944"/><stop offset=".62" stop-color="#16130f"/><stop offset="1" stop-color="#090807"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6aab"/><stop offset=".36" stop-color="#8aaad2"/><stop offset=".55" stop-color="#f3c18a"/>
      <stop offset=".635" stop-color="#e98a45"/><stop offset=".645" stop-color="#1c1a14"/><stop offset="1" stop-color="#0d0c09"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3c8"/><stop offset=".35" stop-color="#ffd596" stop-opacity=".75"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset=".3" stop-color="#8d8984"/><stop offset=".55" stop-color="#2c2a28"/><stop offset=".8" stop-color="#cdc8be"/><stop offset="1" stop-color="#77736d"/></linearGradient>
    <clipPath id="lens"><circle cx="256" cy="256" r="100"/></clipPath>
    <clipPath id="outer"><circle cx="256" cy="256" r="216"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect id="bg" width="512" height="512" fill="url(#bg)"/>
